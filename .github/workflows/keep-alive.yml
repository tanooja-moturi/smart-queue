name: Keep QFlow Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render
        run: |
          curl -f -sS --connect-timeout 15 --max-time 120 --retry 2 --retry-delay 5 \
          https://qflow-smart-queue-new.onrender.com
